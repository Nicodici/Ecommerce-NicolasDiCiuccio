<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecommerce</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Play&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"> 
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/ionicons@latest/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://cdn.jsdelivr.net/npm/ionicons@latest/dist/ionicons/ionicons.js"
    ></script>
    
  </head>
  <body>
    <div class="wrapper">
      <header class="header">
        <nav class="navig">
          <div class="nav-div">
            <a href="index.html"><ion-icon class="icon" name="logo-tux"></ion-icon>DiciSHOP</a>
          </div>
          <div class="InputContainer">
  <input
    placeholder="Buscar..."
    id="input"
    class="input"
    name="text"
    type="text"
  />

  <label class="labelforsearch" for="input">
    <svg class="searchIcon" viewBox="0 0 512 512">
      <path
        d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"
      ></path>
    </svg>
  </label>
</div>

          <div class="nav-div">
            <div class="icon-cart">
              <a id="cart-link" href="./carrito.html"
                ><ion-icon class="icon" name="cart-outline"></ion-icon>Carrito</a
              >
            </div>
            
            <div class="cont-cart">
              <span id ="number">0</span>
            </div>
          </div>
        </nav>
      </header>  
      <main>
        <div class ="divFilters">
          <ul class="menu">
            <li><button id="filterAll" class="li-button" ><span class="li-span">Coleccion</span></button></li>
            <li><button id="camisetas" class="li-button" ><span class="li-span">Camisas</span></button></li>
            <li><button id="zapatillas" class="li-button" ><span class="li-span">Zapatillas</span></button></li>
            <li><button id="pantalones" class="li-button" ><span class="li-span">Pantalones</span></button></li>
            <li><button id="vestidos" class="li-button" ><span class="li-span">Vestidos</span></button></li>
          </ul>
          </div>
          
        <div class="titulos">
          <h2 id="tit-principal" class="titulo-p">Colección 2025</h2>
        </div>
        <div class="modal">
          <div class="backdrop">
            <div class="contenido">
              <h2>modal as de producto</h2>
              <button id="dropModal" class="btnModalClose">X</button>
            </div>
          </div>
        </div>
        <div id="containerSpinner">
          <div id="l1">L</div>
          <div id="l2">O</div>
          <div id="l3">A</div>
          <div id="l4">D</div>
          <div id="l5">I</div>
          <div id="l6">N</div>
          <div id="l7">G</div>
        </div>
        <div id="cont-products" class="cont-products">
          <!-- Acá se va a rellenar con los productos creados por el main.js-->
        </div>
        </main>
    <footer>
      <div class="footer">
        <div class="row">
          <a href="#"><i class="fa fa-facebook"></i></a>
          <a href="#"><i class="fa fa-instagram"></i></a>
          <a href="#"><i class="fa fa-youtube"></i></a>
          <a href="#"><i class="fa fa-twitter"></i></a>
        </div>

        <div class="row">
          <ul>
            <li><a href="#">Contactanos</a></li>
            <li><a href="#">Otros servicios</a></li>
            <li><a href="#">Terminos y condiciones</a></li>
          </ul>
        </div>
        <div class="row"> 
          DiciShop Copyright © 2025 - All rights reserved || Designed By:
          Nicoici
        </div>
      </div>
      </footer>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="/js/modules/main.js"></script>
  </body>
</html>
